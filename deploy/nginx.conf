# saas-identity-platform nginx 主配置（覆盖 alpine 默认 /etc/nginx/nginx.conf）
#
# 容器内 supervicod 同时拉：
#   - nginx 80   ：serve SPA（react-id 容器内自身） + /api/* 反代到容器内 node Hono 5176
#   - node 5176  ：saas 真后端（dev-server 4 条 auth 端点 + /health）
#
# 配套：deploy/supervisord.conf / Dockerfile（alpine apk add nginx nodejs supervisor）

user root;  # alpine 容器 root，免特权警告
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # gzip（单页 + JS bundle 大）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ==== /api/* 反代到容器内 supervisord 拉的 node Hono (5176) ====
    location = /health {
        proxy_pass http://127.0.0.1:5176/health;
        access_log off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # 不要 /index.html 回退：/api/* 必须真后端响应，404 是合法的
    }

    # ==== SPA 静态资源 ====
    server {
        listen 80 default_server;
        server_name _;

        location / {
            root /var/www/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # web-vitals 上报端点：返 204 让 fetch / sendBeacon 干净收尾
        location = /api/vitals {
            return 204;
        }

        # 静态资源缓存（带 hash 的 js/css 永久缓存）
        location /assets/ {
            root /var/www/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html 不缓存（保证发布后立即生效）
        location = /index.html {
            root /var/www/frontend;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
