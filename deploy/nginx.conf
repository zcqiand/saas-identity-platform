# ch42 Nginx 配置（前端 SPA + 反向代理到容器内 Hono 后端）
# 前端静态资源 root /var/www/frontend。
# /api/* 反代到容器内 supervisord 拉的 node Hono (127.0.0.1:5176)。
# 由 supervisord 同时拉 nginx (80) + node (5176)，任一退出即重启。
# 配套：deploy/supervisord.conf / Dockerfile (alpine 含 node+supervisor)

server {
    listen 80;
    server_name _;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 4 条 saas auth 端点 + /health 反代到容器内 node Hono (5176)
    location /api/ {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # 不要 /index.html 回退：/api/* 必须真后端响应，404 是合法的
    }

    # 前端 SPA 静态资源
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # web-vitals 上报端点：返 204 让 fetch / sendBeacon 干净收尾；
    # Sentry / vitals 走 fetch(..).catch() 当 2xx 看待，跳 sendBeacon
    # 的 onerror 报黄。
    location = /api/vitals {
        return 204;
    }

    # 静态资源缓存（带 hash 的 js/css 永久缓存）
    location /assets/ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（保证发布后立即生效）
    location = /index.html {
        root /var/www/frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
