; supervisord.conf
; 同时拉 nginx（80，serve SPA）和 node Hono（5176，serve /api/*）；
; 容器内 nginx 反代 /api/* → http://127.0.0.1:5176 在 nginx.conf 配。
;
; 进程模型：foreground（supervisord 自己 PID 1 死守），任一进程退
; 出 → supervisor 重启 → 容器不挂。

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; —— nginx：serve SPA + 反代 /api/* ——
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; —— node Hono：serve saas 4 条 auth + /health ——
; SAAS_ALLOWED_ORIGINS：生产端追加允许源（逗号分隔）；
; 容器内默认 dev 自调用（localhost:5173/5175），加 react-lab.xiangru.uk
[program:api]
command=node /app/dist-server/server.js
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SAAS_API_PORT="5176",NODE_ENV="production",SAAS_ALLOWED_ORIGINS="https://react-lab.xiangru.uk"

[group:all]
programs=nginx,api
